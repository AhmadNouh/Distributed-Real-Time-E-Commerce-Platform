# version: '3.8'
services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis
      - rabbitmq
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ecommerce
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672

      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: "null"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""

      BROADCAST_CONNECTION: pusher
      PUSHER_APP_ID: "${PUSHER_APP_ID}"
      PUSHER_APP_KEY: "${PUSHER_APP_KEY}"
      PUSHER_APP_SECRET: "${PUSHER_APP_SECRET}"
      PUSHER_APP_CLUSTER: "${PUSHER_APP_CLUSTER}"

      INVENTORY_DRIVER: grpc
      WAREHOUSE_ADDR: warehouse:50051
      WAREHOUSE_TIMEOUT: 2
  
      PHP_OPCACHE_ENABLE: "true"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
      PHP_OPCACHE_REVALIDATE_FREQ: "60"
  queue-worker:

    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis
      - rabbitmq
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ecommerce
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672

      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: ""
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""

      BROADCAST_CONNECTION: pusher
      PUSHER_APP_ID: "${PUSHER_APP_ID}"
      PUSHER_APP_KEY: "${PUSHER_APP_KEY}"
      PUSHER_APP_SECRET: "${PUSHER_APP_SECRET}"
      PUSHER_APP_CLUSTER: "${PUSHER_APP_CLUSTER}"
      
      
      INVENTORY_DRIVER: grpc
      WAREHOUSE_ADDR: warehouse:50051
      WAREHOUSE_TIMEOUT: 2
      PHP_OPCACHE_ENABLE: "true"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
      PHP_OPCACHE_REVALIDATE_FREQ: "60"

  postgres:
    image: postgres:16-alpine
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:                      # ← أضف هذا
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-replica:
    image: postgres:16-alpine
    entrypoint:
      - sh
      - -c
      - |
        until PGPASSWORD=postgres pg_isready -h postgres -p 5432 -U postgres; do
          echo "waiting for primary..."
          sleep 2
        done
        rm -rf /var/lib/postgresql/data/*
        PGPASSWORD=postgres pg_basebackup -h postgres -p 5432 -U postgres -D /var/lib/postgresql/data -P --wal-method=stream -R
        chown -R postgres:postgres /var/lib/postgresql/data
        chmod 700 /var/lib/postgresql/data
        exec su postgres -c "postgres -c hot_standby=on"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - replica_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
 
  rabbitmq: 
    image: rabbitmq:3-management-alpine
    container_name: ecommerce-rabbitmq
    ports: 
      - "5672:5672"  
      - "15672:15672"
    environment: 
        RABBITMQ_DEFAULT_USER: guest
        RABBITMQ_DEFAULT_PASS: guest 
     
    volumes:
     - rabbitmq_data:/var/lib/rabbitmq
  
  warehouse:
    build:
      context: ./services/warehouse
      dockerfile: Dockerfile
    environment:
      DB_DSN: postgres://warehouse:warehouse@warehouse-db:5432/warehouse?sslmode=disable
      GRPC_PORT: 50051
    ports:
      - "50051:50051"
    depends_on:
      warehouse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/warehouse", "-healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
  warehouse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
    ports:
      # 5433 on the host so it never clashes with the e-commerce database.
      - "5434:5432"
    volumes:
      - warehouse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  warehouse_pgdata:
  replica_pgdata:
  rabbitmq_data:
