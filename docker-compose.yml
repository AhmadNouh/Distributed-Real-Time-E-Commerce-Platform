# version: '3.8'
services:
  # One-shot helper. Composer's dependencies live in the php_vendor volume
  # (reading ~10k files through the Windows bind mount is very slow). On a
  # fresh checkout that volume is empty, so this copies the host's ./vendor
  # into it once. Run `composer install` on the host first.
  vendor-init:
    image: alpine
    volumes:
      - ./vendor:/src:ro
      - php_vendor:/dest
    command:
      - sh
      - -c
      - |
        if [ ! -f /dest/autoload.php ]; then
          if [ -z "$$(ls -A /src 2>/dev/null)" ]; then
            echo "ERROR: ./vendor is empty - run 'composer install' on the host first" >&2
            exit 1
          fi
          echo "seeding php_vendor from ./vendor ..."
          cp -a /src/. /dest/
        else
          echo "php_vendor already populated, skipping"
        fi
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
      # Composer's dependencies are ~10k files. Reading them through the
      # Windows bind mount is very slow, so they live in a named volume that
      # was copied from ./vendor once (see README/notes). Re-copy after
      # running `composer install` on the host.
      - php_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      vendor-init:
        condition: service_completed_successfully
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ecommerce
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      INVENTORY_DRIVER: grpc
      WAREHOUSE_ADDR: warehouse:50051
      WAREHOUSE_TIMEOUT: 2
      # Without opcache every request recompiles the whole framework from the
      # bind mount (~2.4s per request on Docker Desktop). Timestamps are still
      # checked, but only once a minute (freq=60), so code edits are picked up
      # without recompiling the framework on every single request.
      PHP_OPCACHE_ENABLE: "true"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
      PHP_OPCACHE_REVALIDATE_FREQ: "60"
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www/html
      - php_vendor:/var/www/html/vendor
    depends_on:
      - app
      - redis
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ecommerce
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      INVENTORY_DRIVER: grpc
      WAREHOUSE_ADDR: warehouse:50051
      WAREHOUSE_TIMEOUT: 2
      PHP_OPCACHE_ENABLE: "true"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
      PHP_OPCACHE_REVALIDATE_FREQ: "60"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
  # ---------------------------------------------------------------------------
  # Requirement 2: standalone warehouse (inventory) service, written in Go and
  # exposing a gRPC API. It owns its own PostgreSQL database (warehouse_pgdata)
  # and the Laravel app only reaches it through proto/warehouse/v1.
  # ---------------------------------------------------------------------------
  warehouse:
    build:
      context: ./services/warehouse
      dockerfile: Dockerfile
    environment:
      DB_DSN: postgres://warehouse:warehouse@warehouse-db:5432/warehouse?sslmode=disable
      GRPC_PORT: 50051
    ports:
      - "50051:50051"
    depends_on:
      warehouse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "warehouse", "-healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
  warehouse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
    ports:
      # 5433 on the host so it never clashes with the e-commerce database.
      - "5434:5432"
    volumes:
      - warehouse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
  warehouse_pgdata:
  # Pinned name: the volume was created and populated once with the host's
  # ./vendor contents, so keep using the exact same volume.
  php_vendor:
    name: drtec_php_vendor
